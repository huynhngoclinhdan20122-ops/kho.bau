<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TÌM KHO BÁU - HÒM ĐẢO BÍ MẬT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container game chuẩn tỉ lệ ảnh gốc */
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 900px;
      height: calc(100vw * (728 / 900));
      max-height: 728px;
      background: url('background.jpg') no-repeat center center/contain;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
      border-radius: 12px;
    }

    /* Thẻ hiển thị Coin */
    .coin-board {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid #ffd700;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    /* Bảng thanh điều khiển nhạc */
    .control-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .btn-ctrl {
      background: #ff9800;
      border: 2px solid #fff;
      color: #fff;
      padding: 6px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }

    .btn-ctrl:active {
      transform: scale(0.95);
    }

    /* Nút PLAY nằm khớp vùng nút ở ảnh gốc */
    #btn-play {
      position: absolute;
      bottom: 2.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 32%;
      height: 10%;
      cursor: pointer;
      z-index: 15;
      border-radius: 30px;
    }

    /* Nhân vật Mèo thợ xây - Đã tối ưu trong suốt tuyệt đối */
    #character {
      position: absolute;
      width: 7.5%;
      height: 13%;
      background: url('cat.png') no-repeat center center/contain;
      background-color: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      transition: all 0.8s ease-in-out;
      z-index: 12;
      filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.4));
    }

    /* Hiệu ứng bước đi nhún nhảy */
    .walking {
      animation: bounce 0.2s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    /* Hộp thoại Câu hỏi Popup */
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .quiz-card {
      background: #fff8dc;
      border: 4px solid #8b4513;
      border-radius: 20px;
      width: 85%;
      max-width: 500px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
    }

    .quiz-card h3 {
      color: #8b4513;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .quiz-card p {
      font-size: 17px;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-opt {
      background: #2196f3;
      color: white;
      border: 2px solid #1565c0;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-opt:hover {
      background: #1e88e5;
    }

    .btn-opt:active {
      transform: scale(0.98);
    }

    .btn-next {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      margin: 10px auto 0;
      box-shadow: 0 4px 0 #2e7d32;
    }

    .btn-next:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #2e7d32;
    }

    .feedback {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      min-height: 25px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- Hiển thị Coins -->
    <div class="coin-board">
      🪙 <span id="coin-count">0</span> COINS
    </div>

    <!-- Thanh điều khiển: Chỉ còn nút Bật/Tắt nhạc -->
    <div class="control-panel">
      <button class="btn-ctrl" onclick="toggleMusic()">🎵 Nhạc: Off</button>
    </div>

    <!-- Nhân vật chú mèo thợ xây -->
    <div id="character"></div>

    <!-- Vùng bấm PLAY -->
    <div id="btn-play" onclick="startGame()"></div>

    <!-- Popup Hỏi - Đáp -->
    <div class="modal" id="quiz-modal">
      <div class="quiz-card">
        <h3 id="stage-title">CHẶNG 1</h3>
        <p id="question-text">Nội dung câu hỏi ở đây?</p>
        <div class="options-grid" id="options-container"></div>
        <div class="feedback" id="feedback-text"></div>
        <button class="btn-next" id="btn-next-stage" onclick="nextStage()">NEXT ➔</button>
      </div>
    </div>
  </div>

  <!-- Nhạc nền TikTok/MP3 được tải lên GitHub với tên music.mp3 -->
  <audio id="bg-music" loop src="music.mp3"></audio>

  <script>
    // Tọa độ 7 mốc hòm vàng (%)
    const STAGE_POSITIONS = [
      { x: 5, y: 80 },    // Vị trí xuất phát (Bến thuyền)
      { x: 12, y: 55 },   // Hòm 1
      { x: 26, y: 22 },   // Hòm 2
      { x: 44, y: 46 },   // Hòm 3
      { x: 62, y: 22 },   // Hòm 4
      { x: 79, y: 56 },   // Hòm 5
      { x: 28, y: 68 },   // Hòm 6
      { x: 68, y: 72 }    // Hòm 7
    ];

    // Dữ liệu ngân hàng câu hỏi (Máy chủ quản lý trực tiếp trong code)
    const questions = [
      // Chặng 1
      [
        { q: "Chặng 1: 1 + 1 bằng bao nhiêu?", opts: ["A. 1", "B. 2", "C. 3", "D. 4"], ans: 1 },
        { q: "Chặng 1 (Đổi câu): 2 + 2 bằng bao nhiêu?", opts: ["A. 2", "B. 3", "C. 4", "D. 5"], ans: 2 },
        { q: "Chặng 1 (Đổi câu): Con mèo kêu như thế nào?", opts: ["A. Gâu gâu", "B. Mèo mèo", "C. Cục tác", "D. Meo meo"], ans: 3 }
      ],
      // Chặng 2
      [
        { q: "Chặng 2: Thủ đô của Việt Nam là gì?", opts: ["A. TP.HCM", "B. Đà Nẵng", "C. Hà Nội", "D. Cần Thơ"], ans: 2 },
        { q: "Chặng 2 (Đổi câu): Quốc kỳ Việt Nam có màu gì làm nền?", opts: ["A. Vàng", "B. Đỏ", "C. Xanh", "D. Trắng"], ans: 1 },
        { q: "Chặng 2 (Đổi câu): Bánh chưng có hình gì?", opts: ["A. Tròn", "B. Tam giác", "C. Vuông", "D. Chữ nhật"], ans: 2 }
      ],
      // Chặng 3
      [
        { q: "Chặng 3: Con vật nào biết bay?", opts: ["A. Chim", "B. Cá", "C. Chó", "D. Mèo"], ans: 0 },
        { q: "Chặng 3 (Đổi câu): Con gì sống dưới nước?", opts: ["A. Gà", "B. Cá", "C. Bò", "D. Thỏ"], ans: 1 },
        { q: "Chặng 3 (Đổi câu): Con gì có vòi rất dài?", opts: ["A. Hổ", "B. Voi", "C. Hươu", "D. Ngựa"], ans: 1 }
      ],
      // Chặng 4
      [
        { q: "Chặng 4: Mặt trời mọc ở hướng nào?", opts: ["A. Tây", "B. Nam", "C. Bắc", "D. Đông"], ans: 3 },
        { q: "Chặng 4 (Đổi câu): Một tuần có bao nhiêu ngày?", opts: ["A. 5 ngày", "B. 6 ngày", "C. 7 ngày", "D. 8 ngày"], ans: 2 },
        { q: "Chặng 4 (Đổi câu): Ban đêm mặt gì xuất hiện?", opts: ["A. Mặt trời", "B. Mặt trăng", "C. Mặt đất", "D. Mặt hồ"], ans: 1 }
      ],
      // Chặng 5
      [
        { q: "Chặng 5: 1 năm có bao nhiêu tháng?", opts: ["A. 10", "B. 11", "C. 12", "D. 13"], ans: 2 },
        { q: "Chặng 5 (Đổi câu): 5 x 5 bằng bao nhiêu?", opts: ["A. 20", "B. 25", "C. 30", "D. 35"], ans: 1 },
        { q: "Chặng 5 (Đổi câu): Đâu là một loại quả?", opts: ["A. Táo", "B. Bàn", "C. Ghế", "D. Bút"], ans: 0 }
      ],
      // Chặng 6
      [
        { q: "Chặng 6: Nước sôi ở bao nhiêu độ C?", opts: ["A. 50°C", "B. 80°C", "C. 100°C", "D. 120°C"], ans: 2 },
        { q: "Chặng 6 (Đổi câu): Đâu là màu cơ bản?", opts: ["A. Đỏ", "B. Nâu", "C. Xám", "D. Hồng"], ans: 0 },
        { q: "Chặng 6 (Đổi câu): Xe máy có mấy bánh?", opts: ["A. 1 bánh", "B. 2 bánh", "C. 3 bánh", "D. 4 bánh"], ans: 1 }
      ],
      // Chặng 7
      [
        { q: "Chặng 7: Đâu là kho báu lớn nhất?", opts: ["A. Vàng", "B. Kim cương", "C. Tri thức", "D. Tiền bạc"], ans: 2 },
        { q: "Chặng 7 (Đổi câu): 10 - 3 bằng bao nhiêu?", opts: ["A. 5", "B. 6", "C. 7", "D. 8"], ans: 2 },
        { q: "Chặng 7 (Đổi câu): Bạn đã sẵn sàng mở kho báu chưa?", opts: ["A. Chưa", "B. Sẵn sàng", "C. Không", "D. Bỏ cuộc"], ans: 1 }
      ]
    ];

    let currentStage = 0;
    let subQuestionIdx = 0;
    let coins = 0;
    let isMusicPlaying = false;

    const char = document.getElementById('character');
    const coinElem = document.getElementById('coin-count');
    const quizModal = document.getElementById('quiz-modal');
    const bgMusic = document.getElementById('bg-music');

    function setCharacterPos(pos) {
      char.style.left = pos.x + '%';
      char.style.top = pos.y + '%';
    }
    setCharacterPos(STAGE_POSITIONS[0]);

    function startGame() {
      document.getElementById('btn-play').style.display = 'none';
      currentStage = 1;
      subQuestionIdx = 0;
      moveToStage(currentStage);
    }

    function moveToStage(stageIdx) {
      char.classList.add('walking');
      const targetPos = STAGE_POSITIONS[stageIdx];
      setCharacterPos(targetPos);

      setTimeout(() => {
        char.classList.remove('walking');
        subQuestionIdx = 0;
        showQuiz(stageIdx, subQuestionIdx);
      }, 850);
    }

    function showQuiz(stageIdx, qSubIdx) {
      const stageBank = questions[stageIdx - 1];
      const actualIdx = qSubIdx % stageBank.length;
      const qData = stageBank[actualIdx];

      document.getElementById('stage-title').innerText = `CHẶNG ${stageIdx}`;
      document.getElementById('question-text').innerText = qData.q;
      
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      document.getElementById('feedback-text').innerText = '';
      document.getElementById('btn-next-stage').style.display = 'none';

      qData.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, qData.ans);
        optsContainer.appendChild(btn);
      });

      quizModal.style.display = 'flex';
    }

    function checkAnswer(selected, correct) {
      const feedback = document.getElementById('feedback-text');
      const buttons = document.querySelectorAll('.btn-opt');

      if (selected === correct) {
        buttons.forEach(b => b.disabled = true);
        feedback.style.color = '#2e7d32';
        feedback.innerText = '🎉 Chính xác! (+100 Coins)';
        playTungTingSound();
        coins += 100;
        coinElem.innerText = coins;
        document.getElementById('btn-next-stage').style.display = 'block';
      } else {
        feedback.style.color = '#c62828';
        feedback.innerText = '😅 Chờ chút... Câu hỏi khác xuất hiện!';
        
        buttons.forEach(b => b.disabled = true);

        setTimeout(() => {
          subQuestionIdx++;
          showQuiz(currentStage, subQuestionIdx);
        }, 1200);
      }
    }

    function nextStage() {
      quizModal.style.display = 'none';
      if (currentStage < 7) {
        currentStage++;
        moveToStage(currentStage);
      } else {
        alert(`🏆 CHÚC MỪNG BẠN ĐÃ HOÀN THÀNH KHO BÁU!\nTổng số coin nhận được: ${coins} Coins`);
        currentStage = 0;
        setCharacterPos(STAGE_POSITIONS[0]);
        document.getElementById('btn-play').style.display = 'block';
      }
    }

    // Âm thanh Tùng ting khi trả lời đúng
    function playTungTingSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
        gain1.gain.setValueAtTime(0.3, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start();
        osc1.stop(ctx.currentTime + 0.3);

        setTimeout(() => {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.frequency.setValueAtTime(1046.50, ctx.currentTime);
          gain2.gain.setValueAtTime(0.4, ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start();
          osc2.stop(ctx.currentTime + 0.5);
        }, 150);
      } catch (e) {
        console.log("Audio error:", e);
      }
    }

    function toggleMusic() {
      const btn = event.target;
      if (isMusicPlaying) {
        bgMusic.pause();
        btn.innerText = '🎵 Nhạc: Off';
      } else {
        bgMusic.play();
        btn.innerText = '🎵 Nhạc: On';
      }
      isMusicPlaying = !isMusicPlaying;
    }
  </script>
</body>
</html>
