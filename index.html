<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TÌM KHO BÁU - HÒM ĐẢO BÍ MẬT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      max-width: 900px;
      height: calc(100vw * (728 / 900));
      max-height: 728px;
      background: url('background.jpg') no-repeat center center/contain;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
      border-radius: 12px;
    }

    .coin-board {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid #ffd700;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    .control-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .btn-ctrl {
      background: #ff9800;
      border: 2px solid #fff;
      color: #fff;
      padding: 6px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }

    .btn-ctrl:active {
      transform: scale(0.95);
    }

    #btn-play {
      position: absolute;
      bottom: 2.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 32%;
      height: 10%;
      cursor: pointer;
      z-index: 15;
      border-radius: 30px;
    }

    #character {
      position: absolute;
      width: 7.5%;
      height: 13%;
      background: url('cat.png') no-repeat center center/contain;
      background-color: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      transition: all 0.8s ease-in-out;
      z-index: 12;
      filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.4));
    }

    .walking {
      animation: bounce 0.2s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .quiz-card {
      background: #fff8dc;
      border: 4px solid #8b4513;
      border-radius: 20px;
      width: 85%;
      max-width: 500px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
    }

    .quiz-card h3 {
      color: #8b4513;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .quiz-card p {
      font-size: 17px;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-opt {
      background: #2196f3;
      color: white;
      border: 2px solid #1565c0;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-opt:hover { background: #1e88e5; }
    .btn-opt:active { transform: scale(0.98); }

    .btn-next {
      background: #4caf50;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      margin: 10px auto 0;
      box-shadow: 0 4px 0 #2e7d32;
    }

    .feedback {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      min-height: 25px;
    }

    .editor-card {
      background: #fdfdfd;
      border: 4px solid #333;
      border-radius: 15px;
      width: 90%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .editor-card h2 {
      text-align: center;
      color: #d32f2f;
      margin-bottom: 15px;
    }

    .edit-group {
      background: #f1f1f1;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .edit-group label {
      font-weight: bold;
      font-size: 13px;
      display: block;
      margin-top: 6px;
      color: #333;
    }

    .edit-group input, .edit-group select {
      width: 100%;
      padding: 6px;
      margin-top: 3px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }

    .btn-save-close {
      display: block;
      width: 100%;
      background: #d32f2f;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="coin-board">
      🪙 <span id="coin-count">0</span> COINS
    </div>

    <div class="control-panel">
      <button class="btn-ctrl" onclick="toggleMusic()">🎵 Nhạc: Off</button>
      <button class="btn-ctrl" onclick="openEditor()">✏️ Sửa Game</button>
    </div>

    <div id="character"></div>
    <div id="btn-play" onclick="startGame()"></div>

    <div class="modal" id="quiz-modal">
      <div class="quiz-card">
        <h3 id="stage-title">CHẶNG 1</h3>
        <p id="question-text">Nội dung câu hỏi ở đây?</p>
        <div class="options-grid" id="options-container"></div>
        <div class="feedback" id="feedback-text"></div>
        <button class="btn-next" id="btn-next-stage" onclick="nextStage()">NEXT ➔</button>
      </div>
    </div>

    <div class="modal" id="edit-modal">
      <div class="editor-card">
        <h2>🔒 QUẢN TRỊ VIÊN SỬA CÂU HỎI</h2>
        <div id="editor-fields"></div>
        <button class="btn-save-close" onclick="closeEditorAndSave()">💾 Đóng & Lưu lại</button>
      </div>
    </div>
  </div>

  <audio id="bg-music" loop src="music.mp3"></audio>

  <script>
    const ADMIN_PASSWORD = "123456";

    const STAGE_POSITIONS = [
      { x: 5, y: 80 },    
      { x: 12, y: 55 },   
      { x: 26, y: 22 },   
      { x: 44, y: 46 },   
      { x: 62, y: 22 },   
      { x: 79, y: 56 },   
      { x: 28, y: 68 },   
      { x: 68, y: 72 }    
    ];

    const questions = [
      [
        { q: "Chặng 1: Kí hiệu hóa học nào sau đây biểu diễn công thức của Natri hiđroxit (xút ăn da)?", opts: ["A. NaCl", "B. NaOH", "C. Na2SO4", "D. Na2CO3"], ans: 1 }
      ],
      [
        { q: "Chặng 2: Bazơ nào sau đây thuộc loại bazơ không tan trong nước?", opts: ["A. NaOH", "B. KOH", "C. Cu(OH)2", "D. Ba(OH)2"], ans: 2 }
      ],
      [
        { q: "Chặng 3: Trên một bóng đèn có ghi 220V - 40W. Con số 40W cho biết điều gì?", opts: ["A. Hiệu điện thế định mức của bóng đèn là 40V", "B. Công suất định mức của bóng đèn là 40W", "C. Điện trở của bóng đèn luôn bằng 40 ôm", "D. Điện năng tiêu thụ của đèn trong 1 giờ luôn là 40J"], ans: 1 }
      ],
      [
        { q: "Chặng 4: Hiện tượng nào dưới đây thể hiện tác dụng từ của dòng điện?", opts: ["A. Dòng điện chạy qua dây dẫn làm dây dẫn nóng lên", "B. Dòng điện chạy qua bóng đèn làm đèn phát sáng", "C. Dòng điện chạy qua cuộn dây dẫn làm quay kim nam châm đặt gần nó", "D. Dòng điện chạy qua dung dịch muối đồng làm tách đồng ra khỏi dung dịch"], ans: 2 }
      ],
      [
        { q: "Chặng 5: Điều kiện xác định của căn thức bậc hai căn(x - 3) là:", opts: ["A. x > 3", "B. x < 3", "C. x >= 3", "D. x <= 3"], ans: 2 }
      ],
      [
        { q: "Chặng 6: Cặp số nào sau đây là nghiệm của hệ phương trình: x + y = 3 và x - y = 1?", opts: ["A. (x = 2; y = 1)", "B. (x = 1; y = 2)", "C. (x = 3; y = 0)", "D. (x = 0; y = 3)"], ans: 0 }
      ],
      [
        { q: "Chặng 7: This is the first time I ________ to Da Nang.", opts: ["A. go", "B. went", "C. have been", "D. am going"], ans: 2 }
      ]
    ];

    let currentStage = 0;
    let subQuestionIdx = 0;
    let coins = 0;
    let isMusicPlaying = false;

    const char = document.getElementById('character');
    const coinElem = document.getElementById('coin-count');
    const quizModal = document.getElementById('quiz-modal');
    const bgMusic = document.getElementById('bg-music');

    function setCharacterPos(pos) {
      char.style.left = pos.x + '%';
      char.style.top = pos.y + '%';
    }
    setCharacterPos(STAGE_POSITIONS[0]);

    function startGame() {
      document.getElementById('btn-play').style.display = 'none';
      currentStage = 1;
      subQuestionIdx = 0;
      moveToStage(currentStage);
    }

    function moveToStage(stageIdx) {
      char.classList.add('walking');
      const targetPos = STAGE_POSITIONS[stageIdx];
      setCharacterPos(targetPos);

      setTimeout(() => {
        char.classList.remove('walking');
        subQuestionIdx = 0;
        showQuiz(stageIdx, subQuestionIdx);
      }, 850);
    }

    function showQuiz(stageIdx, qSubIdx) {
      const stageBank = questions[stageIdx - 1];
      const actualIdx = qSubIdx % stageBank.length;
      const qData = stageBank[actualIdx];

      document.getElementById('stage-title').innerText = `CHẶNG ${stageIdx}`;
      document.getElementById('question-text').innerText = qData.q;
      
      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';
      document.getElementById('feedback-text').innerText = '';
      document.getElementById('btn-next-stage').style.display = 'none';

      qData.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, qData.ans);
        optsContainer.appendChild(btn);
      });

      quizModal.style.display = 'flex';
    }

    function checkAnswer(selected, correct) {
      const feedback = document.getElementById('feedback-text');
      const buttons = document.querySelectorAll('.btn-opt');

      if (selected === correct) {
        buttons.forEach(b => b.disabled = true);
        feedback.style.color = '#2e7d32';
        feedback.innerText = '🎉 Chính xác! (+100 Coins)';
        playTungTingSound();
        coins += 100;
        coinElem.innerText = coins;
        document.getElementById('btn-next-stage').style.display = 'block';
      } else {
        feedback.style.color = '#c62828';
        feedback.innerText = '😅 Chưa chính xác, thử lại nhé!';
        buttons.forEach(b => b.disabled = true);

        setTimeout(() => {
          subQuestionIdx++;
          showQuiz(currentStage, subQuestionIdx);
        }, 1200);
      }
    }

    function nextStage() {
      quizModal.style.display = 'none';
      if (currentStage < 7) {
        currentStage++;
        moveToStage(currentStage);
      } else {
        alert(`🏆 CHÚC MỪNG BẠN ĐÃ HOÀN THÀNH KHO BÁU!\nTổng số coin nhận được: ${coins} Coins`);
        currentStage = 0;
        setCharacterPos(STAGE_POSITIONS[0]);
        document.getElementById('btn-play').style.display = 'block';
      }
    }

    function openEditor() {
      const pass = prompt("🔐 Nhập mật khẩu quản trị viên để sửa game:");
      if (pass !== ADMIN_PASSWORD) {
        if (pass !== null) alert("❌ Sai mật khẩu! Bạn không có quyền chỉnh sửa.");
        return;
      }

      const container = document.getElementById('editor-fields');
      container.innerHTML = '';

      questions.forEach((stageBank, i) => {
        const q = stageBank[0];
        let optionsHTML = '';
        q.opts.forEach((opt, oIdx) => {
          optionsHTML += `<input type="text" id="edit-q${i}-opt${oIdx}" value="${opt}">`;
        });

        container.innerHTML += `
          <div class="edit-group">
            <label>Chặng ${i + 1} - Câu hỏi chính:</label>
            <input type="text" id="edit-q${i}-text" value="${q.q}">
            <label>Các đáp án (A, B, C, D):</label>
            ${optionsHTML}
            <label>Đáp án đúng (0: Đáp án 1, 1: Đáp án 2, 2: Đáp án 3, 3: Đáp án 4):</label>
            <input type="number" min="0" max="3" id="edit-q${i}-ans" value="${q.ans}">
          </div>
        `;
      });

      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditorAndSave() {
      questions.forEach((stageBank, i) => {
        const newText = document.getElementById(`edit-q${i}-text`).value;
        const opt0 = document.getElementById(`edit-q${i}-opt0`).value;
        const opt1 = document.getElementById(`edit-q${i}-opt1`).value;
        const opt2 = document.getElementById(`edit-q${i}-opt2`).value;
        const opt3 = document.getElementById(`edit-q${i}-opt3`).value;
        const newAns = parseInt(document.getElementById(`edit-q${i}-ans`).value);

        stageBank[0].q = newText;
        stageBank[0].opts = [opt0, opt1, opt2, opt3];
        stageBank[0].ans = newAns;
      });

      document.getElementById('edit-modal').style.display = 'none';
      alert("✅ Đã cập nhật câu hỏi tạm thời cho phiên chơi này!");
    }

    function playTungTingSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
        gain1.gain.setValueAtTime(0.3, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start();
        osc1.stop(ctx.currentTime + 0.3);

        setTimeout(() => {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.frequency.setValueAtTime(1046.50, ctx.currentTime);
          gain2.gain.setValueAtTime(0.4, ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start();
          osc2.stop(ctx.currentTime + 0.5);
        }, 150);
      } catch (e) { console.log(e); }
    }

    function toggleMusic() {
      const btn = event.target;
      if (isMusicPlaying) {
        bgMusic.pause();
        btn.innerText = '🎵 Nhạc: Off';
      } else {
        bgMusic.play();
        btn.innerText = '🎵 Nhạc: On';
      }
      isMusicPlaying = !isMusicPlaying;
    }
  </script>
</body>
</html>
